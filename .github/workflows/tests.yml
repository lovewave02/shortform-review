name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned images: 24.04 ships FFmpeg 6.1, the minimum supported version.
          - os: ubuntu-24.04
            python-version: '3.10'
          - os: ubuntu-26.04
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && ffmpeg -version | head -n 1
      - name: Install package
        run: python -m pip install .
      - name: Run unit and synthetic media tests
        run: python -m unittest discover -s tests -v
